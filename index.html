<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tuff</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #313338; color: #dbdee1; display: flex; height: 100vh; overflow: hidden; }
    
    .sidebar { width: 240px; background-color: #2b2d31; display: flex; flex-direction: column; border-right: 1px solid #1f2023; }
    .server-header { padding: 16px; font-weight: 700; color: #f2f3f5; border-bottom: 1px solid #1f2023; font-size: 15px; }
    .channel-list { flex: 1; overflow-y: auto; padding: 10px 8px; }
    .section-label { font-size: 11px; font-weight: 700; color: #949ba4; text-transform: uppercase; margin: 12px 8px 4px; }
    
    .channel { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; color: #949ba4; cursor: pointer; font-size: 14px; font-weight: 500; margin-bottom: 2px; }
    .channel:hover { background-color: #35373c; color: #dbdee1; }
    .channel.active { background-color: #404249; color: #ffffff; }
    
    .main-content { flex: 1; display: flex; flex-direction: column; background-color: #313338; }
    .chat-header { height: 48px; border-bottom: 1px solid #1f2023; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: 600; color: #f2f3f5; }
    
    .chat-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { display: flex; flex-direction: column; }
    .msg-author { font-size: 13px; font-weight: 600; color: #f2f3f5; margin-bottom: 2px; }
    .msg-content { font-size: 14px; color: #dbdee1; line-height: 1.4; }
    
    .input-container { padding: 16px; background-color: #313338; }
    .input-box { width: 100%; background-color: #383a40; border: none; border-radius: 8px; padding: 12px 16px; color: #dcddde; font-size: 14px; outline: none; }
    
    .vc-bar { background-color: #232428; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #1f2023; }
    .vc-info { font-size: 12px; color: #23a55a; font-weight: 600; }
    .btn { background-color: #5865f2; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-danger { background-color: #da373c; }
    .id-tag { font-size: 11px; color: #949ba4; background: #1e1f22; padding: 4px 8px; border-radius: 4px; user-select: all; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="server-header">P2P Server</div>
    <div class="channel-list">
      <div class="section-label">Text Channels</div>
      <div class="channel active" onclick="switchChannel('general', 'text', this)"># general</div>
      <div class="channel" onclick="switchChannel('announcements', 'text', this)"># announcements</div>
      <div class="channel" onclick="switchChannel('off-topic', 'text', this)"># off-topic</div>

      <div class="section-label" style="margin-top: 16px;">Voice Channels</div>
      <div class="channel" onclick="joinVoice('Lounge 1', this)">🔊 Lounge 1</div>
      <div class="channel" onclick="joinVoice('Lounge 2', this)">🔊 Lounge 2</div>
      <div class="channel" onclick="joinVoice('Lounge 3', this)">🔊 Lounge 3</div>
      <div class="channel" onclick="joinVoice('Lounge 4', this)">🔊 Lounge 4</div>
      <div class="channel" onclick="joinVoice('Lounge 5', this)">🔊 Lounge 5</div>
    </div>
    
    <div class="vc-bar" id="vc-bar" style="display: none;">
      <div>
        <div class="vc-info">Voice Connected</div>
        <div id="vc-channel-name" style="font-size: 11px; color: #949ba4;">Lounge 1</div>
      </div>
      <button class="btn btn-danger" onclick="leaveVoice()">Disconnect</button>
    </div>
  </div>

  <div class="main-content">
    <div class="chat-header">
      <span id="current-channel-title"># general</span>
      <div>
        <span class="id-tag" id="my-id">Initializing ID...</span>
        <button class="btn" style="margin-left: 8px;" onclick="connectPeerPrompt()">Connect Peer</button>
      </div>
    </div>

    <div class="chat-area" id="chat-area"></div>

    <div class="input-container">
      <input type="text" class="input-box" id="msg-input" placeholder="Message #general" onkeydown="if(event.key==='Enter') sendMsg()" />
    </div>
  </div>

  <audio id="remote-audio" autoplay></audio>

  <script>
    const peer = new Peer();
    let connections = [];
    let activeStream = null;
    let activeCall = null;
    let currentChannel = 'general';
    
    const chats = {
      'general': JSON.parse(localStorage.getItem('chat_general') || '[]'),
      'announcements': JSON.parse(localStorage.getItem('chat_announcements') || '[]'),
      'off-topic': JSON.parse(localStorage.getItem('chat_off-topic') || '[]')
    };

    peer.on('open', (id) => {
      document.getElementById('my-id').innerText = `Your ID: ${id}`;
      renderMessages();
    });

    peer.on('connection', (conn) => {
      setupDataConn(conn);
    });

    peer.on('call', (call) => {
      navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
        call.answer(stream);
        call.on('stream', (remoteStream) => {
          document.getElementById('remote-audio').srcObject = remoteStream;
        });
      });
    });

    function connectPeerPrompt() {
      const targetId = prompt("Enter peer ID to connect:");
      if (targetId) {
        const conn = peer.connect(targetId);
        setupDataConn(conn);
      }
    }

    function setupDataConn(conn) {
      connections.push(conn);
      conn.on('data', (data) => {
        if (data.type === 'msg') {
          saveAndRenderMsg(data.channel, data.author, data.text);
        }
      });
    }

    function switchChannel(name, type, el) {
      document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      currentChannel = name;
      document.getElementById('current-channel-title').innerText = `# ${name}`;
      document.getElementById('msg-input').placeholder = `Message #${name}`;
      renderMessages();
    }

    function sendMsg() {
      const input = document.getElementById('msg-input');
      const val = input.value.trim();
      if (!val) return;

      const payload = { type: 'msg', channel: currentChannel, author: peer.id.substring(0, 5), text: val };
      connections.forEach(c => c.send(payload));
      
      saveAndRenderMsg(currentChannel, 'You', val);
      input.value = '';
    }

    function saveAndRenderMsg(channel, author, text) {
      if (!chats[channel]) chats[channel] = [];
      chats[channel].push({ author, text });
      localStorage.setItem(`chat_${channel}`, JSON.stringify(chats[channel]));
      if (channel === currentChannel) renderMessages();
    }

    function renderMessages() {
      const area = document.getElementById('chat-area');
      area.innerHTML = '';
      (chats[currentChannel] || []).forEach(m => {
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `<div class="msg-author">${m.author}</div><div class="msg-content">${m.text}</div>`;
        area.appendChild(div);
      });
      area.scrollTop = area.scrollHeight;
    }

    async function joinVoice(channelName, el) {
      document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      
      try {
        activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        document.getElementById('vc-bar').style.display = 'flex';
        document.getElementById('vc-channel-name').innerText = channelName;

        connections.forEach(conn => {
          activeCall = peer.call(conn.peer, activeStream);
          activeCall.on('stream', (remoteStream) => {
            document.getElementById('remote-audio').srcObject = remoteStream;
          });
        });
      } catch (err) {
        alert("Microphone access required for Voice Channels.");
      }
    }

    function leaveVoice() {
      if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('vc-bar').style.display = 'none';
    }
  </script>
</body>
</html>
