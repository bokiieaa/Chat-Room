<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Chat</title>
    <!-- Favicon from same directory -->
    <link rel="icon" type="image/png" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #chat-box::-webkit-scrollbar { width: 6px; }
        #chat-box::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        #chat-box::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen flex flex-col font-sans overflow-hidden antialiased">

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-5">
            <div class="text-center">
                <img src="icon.png" alt="Mesh Logo" class="w-12 h-12 mx-auto mb-2 object-contain" onerror="this.style.display='none'">
                <h2 class="text-2xl font-black bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Mesh Network Access</h2>
                <p class="text-xs text-slate-400 mt-1">Sign in or create an account to enter</p>
            </div>
            
            <form id="auth-form" onsubmit="return false;" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Username</label>
                    <input type="text" id="auth-username" required placeholder="Choose or enter username" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Password</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" id="login-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-xs font-bold py-2.5 rounded-lg transition-colors cursor-pointer">LOG IN</button>
                    <button type="button" id="signup-btn" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold py-2.5 rounded-lg transition-colors cursor-pointer">SIGN UP</button>
                </div>
            </form>

            <div id="auth-error" class="text-xs text-rose-400 hidden"></div>
        </div>
    </div>

    <!-- Active Call Bar -->
    <div id="call-bar" class="hidden bg-indigo-950/80 border-b border-indigo-500/30 px-4 py-2.5 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center gap-3 min-w-0">
            <span class="relative flex h-3 w-3 shrink-0">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            <span id="call-status" class="text-xs font-bold text-indigo-200 truncate">Calling...</span>
            <audio id="remote-audio" autoplay></audio>
        </div>
        <button id="end-call-btn" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-colors cursor-pointer shrink-0 ml-2">End Call</button>
    </div>

    <!-- Main App Layout -->
    <div class="flex-1 flex overflow-hidden min-w-0">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shrink-0 hidden md:flex">
            <div class="p-4 space-y-6">
                <div class="flex items-center gap-2 mb-4">
                    <img src="icon.png" alt="App Icon" class="w-6 h-6 object-contain" onerror="this.style.display='none'">
                    <span class="font-bold text-sm text-slate-200">Mesh Chat</span>
                </div>

                <div>
                    <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Channels</h2>
                    <nav class="space-y-1" id="channel-list">
                        <button data-channel="general" class="channel-btn w-full text-left px-3 py-2 rounded-lg text-xs font-semibold bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 flex items-center gap-2"># general</button>
                        <button data-channel="announcements" class="channel-btn w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-colors flex items-center gap-2"># announcements</button>
                        <button data-channel="dev-talk" class="channel-btn w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-colors flex items-center gap-2"># dev-talk</button>
                        <button data-channel="media" class="channel-btn w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-colors flex items-center gap-2"># media</button>
                        <button data-channel="off-topic" class="channel-btn w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-colors flex items-center gap-2"># off-topic</button>
                    </nav>
                </div>

                <div>
                    <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Direct Voice Call</h2>
                    <div class="space-y-2">
                        <input type="text" id="target-call-user" placeholder="Target Username..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                        <button id="start-call-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-1.5 rounded-lg transition-colors cursor-pointer">Call User</button>
                    </div>
                </div>

                <div class="pt-2 border-t border-slate-800">
                    <label class="flex items-center justify-between text-xs text-slate-400 font-semibold cursor-pointer select-none">
                        <span>Do Not Disturb</span>
                        <input type="checkbox" id="dnd-toggle" class="sr-only peer">
                        <div class="w-8 h-4 bg-slate-800 rounded-full peer peer-checked:bg-indigo-600 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all relative"></div>
                    </label>
                </div>
            </div>

            <div class="p-4 border-t border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-2 min-w-0">
                    <div id="user-avatar" class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold shrink-0">?</div>
                    <span id="current-user-display" class="text-xs font-semibold text-slate-300 truncate">Guest</span>
                </div>
                <button id="logout-btn" class="text-xs text-slate-500 hover:text-slate-300 transition-colors cursor-pointer shrink-0 ml-2">Logout</button>
            </div>
        </aside>

        <!-- Chat Main Area -->
        <main class="flex-1 flex flex-col bg-slate-950 min-w-0 overflow-hidden">
            <header class="p-3 sm:p-4 border-b border-slate-800 bg-slate-900/40 flex items-center justify-between shrink-0">
                <h1 id="active-channel-title" class="text-sm font-bold text-slate-200 truncate"># general</h1>
            </header>

            <div id="chat-box" class="flex-1 p-3 sm:p-6 overflow-y-auto space-y-4 min-w-0"></div>

            <!-- Reply Banner (Constrained) -->
            <div id="reply-preview" class="hidden bg-slate-900 border-t border-slate-800 px-3 py-2 flex items-center justify-between text-xs text-slate-400 shrink-0 min-w-0 gap-2">
                <div class="truncate flex-1 min-w-0">
                    Replying to <b id="reply-target-user" class="text-indigo-400"></b>: "<span id="reply-target-text" class="italic truncate inline-block align-bottom max-w-[200px] sm:max-w-md"></span>"
                </div>
                <button id="cancel-reply-btn" class="text-slate-500 hover:text-slate-300 font-bold shrink-0 text-base px-1.5 cursor-pointer">&times;</button>
            </div>

            <!-- Media Preview Banner (Constrained) -->
            <div id="file-preview" class="hidden bg-slate-900 border-t border-slate-800 px-3 py-2 flex items-center justify-between text-xs text-indigo-300 shrink-0 min-w-0 gap-2">
                <span id="file-preview-name" class="truncate flex-1 min-w-0"></span>
                <button id="cancel-file-btn" class="text-slate-500 hover:text-slate-300 font-bold shrink-0 text-base px-1.5 cursor-pointer">&times;</button>
            </div>

            <footer class="p-3 sm:p-4 bg-slate-900/80 border-t border-slate-800 shrink-0">
                <form id="chat-form" class="flex items-center gap-2 min-w-0">
                    <label for="media-file-input" title="Attach Media or File" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl text-xs font-bold cursor-pointer transition-colors border border-slate-700 shrink-0 flex items-center justify-center">
                        📎
                    </label>
                    <input type="file" id="media-file-input" class="hidden" accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx,.zip">
                    <input type="text" id="msg-input" placeholder="Broadcast message..." autocomplete="off" class="flex-1 min-w-0 bg-slate-950 border border-slate-800 rounded-xl px-3 sm:px-4 py-2.5 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    <button type="submit" id="send-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold uppercase px-4 sm:px-5 py-2.5 rounded-xl transition-colors cursor-pointer shrink-0">Send</button>
                </form>
            </footer>
        </main>
    </div>

    <script>
        const SUPABASE_URL = "https://wmxynxxbpxzfahqanfot.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_CFuOicrEE8nWiOUFEir3oQ_Chb7hnMt";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let activeChannel = 'general';
        let activeReplyId = null;
        let selectedFile = null;
        let knownMessageIds = new Set();
        let fastPollingInterval = null;

        // WebRTC & Ringtone State
        let peerConnection = null;
        let localStream = null;
        let activeCallTarget = null;
        let personalSignalingChannel = null;
        let iceCandidateQueue = [];
        let ringtoneAudio = null;
        let ringtoneInterval = null;
        let audioCtx = null;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // DOM Elements
        const authModal = document.getElementById('auth-modal');
        const authError = document.getElementById('auth-error');
        const loginBtn = document.getElementById('login-btn');
        const signupBtn = document.getElementById('signup-btn');
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const msgInput = document.getElementById('msg-input');
        const replyPreview = document.getElementById('reply-preview');
        const mediaFileInput = document.getElementById('media-file-input');
        const filePreview = document.getElementById('file-preview');
        const filePreviewName = document.getElementById('file-preview-name');
        const dndToggle = document.getElementById('dnd-toggle');

        // --- RINGTONE PLAYER (using ringtone.mp3 from same folder with synth fallback) ---
    function playRingtone() {
        stopRingtone();
    
        ringtoneAudio = new Audio('ringtone.mp3');
        ringtoneAudio.loop = true;
    
        ringtoneAudio.play().then(() => {
            console.log("Ringtone playing successfully.");
        }).catch(err => {
            console.warn("ringtone.mp3 failed to play:", err);
        // Fall back to WebAudio synthesizer if MP3 fails
            playFallbackSynthRingtone();
        });
    }

        function playFallbackSynthRingtone() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            function playBurst() {
                if (!audioCtx) return;
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc1.frequency.value = 440;
                osc2.frequency.value = 480;

                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);

                osc1.start();
                osc2.start();
                osc1.stop(audioCtx.currentTime + 1.8);
                osc2.stop(audioCtx.currentTime + 1.8);
            }
            playBurst();
            ringtoneInterval = setInterval(playBurst, 3000);
        }

        function stopRingtone() {
            if (ringtoneAudio) {
                ringtoneAudio.pause();
                ringtoneAudio.currentTime = 0;
                ringtoneAudio = null;
            }
            if (ringtoneInterval) {
                clearInterval(ringtoneInterval);
                ringtoneInterval = null;
            }
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
        }

        // --- AUTHENTICATION ---
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        signupBtn.addEventListener('click', async () => {
            authError.classList.add('hidden');
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value;

            if (!username || !password) return showAuthError("Username and password required.");
            if (password.length < 6) return showAuthError("Password must be at least 6 characters.");

            const { data: existingUser } = await supabaseClient
                .from('profiles')
                .select('username')
                .eq('username', username)
                .maybeSingle();

            if (existingUser) return showAuthError("Username is already taken.");

            const passwordHash = await hashPassword(password);
            const userId = crypto.randomUUID();

            const { error } = await supabaseClient
                .from('profiles')
                .insert([{ id: userId, username, password_hash: passwordHash }]);

            if (error) return showAuthError("Account creation failed: " + error.message);

            initAuthenticatedSession({ id: userId }, username);
        });

        loginBtn.addEventListener('click', async () => {
            authError.classList.add('hidden');
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value;

            if (!username || !password) return showAuthError("Username and password required.");

            const passwordHash = await hashPassword(password);

            const { data: userProfile, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('username', username)
                .maybeSingle();

            if (error || !userProfile) return showAuthError("Account not found.");
            if (userProfile.password_hash !== passwordHash) return showAuthError("Incorrect password.");

            initAuthenticatedSession({ id: userProfile.id }, userProfile.username);
        });

        function showAuthError(msg) {
            authError.textContent = msg;
            authError.classList.remove('hidden');
        }

        function initAuthenticatedSession(user, username) {
            currentUser = { id: user.id, username };
            document.getElementById('current-user-display').textContent = username;
            document.getElementById('user-avatar').textContent = username.charAt(0).toUpperCase();
            authModal.classList.add('hidden');
            
            listenToPersonalSignaling();
            loadChannelMessages();
            startFastPolling();
            listenToRealtimeMessages();
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            window.location.reload();
        });

        // --- FILE SELECTION & PREVIEW ---
        mediaFileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                selectedFile = e.target.files[0];
                filePreviewName.textContent = `Attached: ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(1)} KB)`;
                filePreview.classList.remove('hidden');
            }
        });

        document.getElementById('cancel-file-btn').addEventListener('click', () => {
            selectedFile = null;
            mediaFileInput.value = '';
            filePreview.classList.add('hidden');
        });

        // --- CHANNELS & MESSAGING ---
        document.querySelectorAll('.channel-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.channel-btn').forEach(b => {
                    b.className = "channel-btn w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-colors flex items-center gap-2";
                });
                btn.className = "channel-btn w-full text-left px-3 py-2 rounded-lg text-xs font-semibold bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 flex items-center gap-2";
                
                activeChannel = btn.dataset.channel;
                document.getElementById('active-channel-title').textContent = `# ${activeChannel}`;
                knownMessageIds.clear();
                chatBox.innerHTML = '';
                loadChannelMessages();
            });
        });

        async function loadChannelMessages() {
            const { data } = await supabaseClient
                .from('chat_messages')
                .select('*')
                .eq('channel_id', activeChannel)
                .order('created_at', { ascending: true })
                .limit(100);

            if (data) {
                data.forEach(msg => {
                    if (!knownMessageIds.has(msg.id)) {
                        knownMessageIds.add(msg.id);
                        appendMessageUI(msg);
                    }
                });
            }
        }

        function startFastPolling() {
            if (fastPollingInterval) clearInterval(fastPollingInterval);
            fastPollingInterval = setInterval(() => {
                if (currentUser && activeChannel) {
                    loadChannelMessages();
                }
            }, 500);
        }

        function appendMessageUI(msg) {
            const msgEl = document.createElement('div');
            msgEl.className = "p-3 bg-slate-900/50 border border-slate-800/80 rounded-xl space-y-2 relative group min-w-0 break-words";

            let replyHeader = msg.reply_to_id ? `<div class="text-[10px] text-indigo-400 font-mono">Replying to #${msg.reply_to_id}</div>` : '';
            
            let mediaContent = '';
            if (msg.media_url) {
                const url = msg.media_url.toLowerCase();

                if (url.match(/\.(jpeg|jpg|gif|png|webp|svg)($|\?)/i)) {
                    mediaContent = `<div class="mt-2"><img src="${escapeHTML(msg.media_url)}" class="max-h-60 rounded-lg border border-slate-800 object-cover max-w-full" loading="lazy"></div>`;
                } else if (url.match(/\.(mp4|webm|ogg|mov)($|\?)/i)) {
                    mediaContent = `<div class="mt-2"><video src="${escapeHTML(msg.media_url)}" controls class="max-h-60 w-full rounded-lg border border-slate-800"></video></div>`;
                } else if (url.match(/\.(mp3|wav|ogg|m4a)($|\?)/i)) {
                    mediaContent = `<div class="mt-2"><audio src="${escapeHTML(msg.media_url)}" controls class="w-full h-8"></audio></div>`;
                } else {
                    mediaContent = `<div class="mt-2"><a href="${escapeHTML(msg.media_url)}" target="_blank" download class="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-indigo-300 px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-700 transition-colors max-w-full truncate">📁 Download Attachment</a></div>`;
                }
            }

            msgEl.innerHTML = `
                ${replyHeader}
                <div class="flex justify-between items-center text-xs gap-2">
                    <span class="font-bold text-slate-200 truncate">${escapeHTML(msg.username)}</span>
                    <span class="text-[10px] text-slate-500 shrink-0">${new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                </div>
                ${msg.message ? `<p class="text-xs text-slate-300 leading-relaxed overflow-hidden break-words">${escapeHTML(msg.message)}</p>` : ''}
                ${mediaContent}
                <button onclick="setReplyTarget(${msg.id}, '${escapeHTML(msg.username)}', '${escapeHTML(msg.message || 'Media file')}')" class="opacity-0 group-hover:opacity-100 absolute top-2 right-2 text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded transition-opacity cursor-pointer">Reply</button>
            `;
            chatBox.appendChild(msgEl);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setReplyTarget(id, username, text) {
            activeReplyId = id;
            document.getElementById('reply-target-user').textContent = username;
            document.getElementById('reply-target-text').textContent = text;
            replyPreview.classList.remove('hidden');
        }

        document.getElementById('cancel-reply-btn').addEventListener('click', () => {
            activeReplyId = null;
            replyPreview.classList.add('hidden');
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if ((!text && !selectedFile) || !currentUser) return;

            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;
            sendBtn.textContent = '...';

            let mediaUrl = null;

            if (selectedFile) {
                try {
                    const fileExt = selectedFile.name.split('.').pop();
                    const filePath = `${currentUser.username}/${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

                    const { data: uploadData, error: uploadError } = await supabaseClient.storage
                        .from('chat-media')
                        .upload(filePath, selectedFile);

                    if (uploadError) throw uploadError;

                    const { data: urlData } = supabaseClient.storage
                        .from('chat-media')
                        .getPublicUrl(filePath);

                    mediaUrl = urlData.publicUrl;
                } catch (err) {
                    alert("Media upload failed: " + err.message + "\nEnsure 'chat-media' bucket exists and is set to Public in Supabase.");
                    sendBtn.disabled = false;
                    sendBtn.textContent = 'Send';
                    return;
                }
            }

            const payload = {
                user_id: currentUser.id,
                username: currentUser.username,
                channel_id: activeChannel,
                message: text,
                reply_to_id: activeReplyId,
                media_url: mediaUrl
            };

            msgInput.value = '';
            selectedFile = null;
            mediaFileInput.value = '';
            filePreview.classList.add('hidden');
            activeReplyId = null;
            replyPreview.classList.add('hidden');

            const { error } = await supabaseClient.from('chat_messages').insert([payload]);
            if (error) alert("Error sending message: " + error.message);

            sendBtn.disabled = false;
            sendBtn.textContent = 'Send';
            loadChannelMessages();
        });

        function listenToRealtimeMessages() {
            supabaseClient
                .channel('public:chat_messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
                    if (payload.new.channel_id === activeChannel && !knownMessageIds.has(payload.new.id)) {
                        knownMessageIds.add(payload.new.id);
                        appendMessageUI(payload.new);
                    }
                }).subscribe();
        }

        // --- WEBRTC SIGNALING & CALLS ---
        function listenToPersonalSignaling() {
            personalSignalingChannel = supabaseClient.channel(`user-signal:${currentUser.username}`);
            
            personalSignalingChannel
                .on('broadcast', { event: 'signal' }, async ({ payload }) => {
                    if (payload.type === 'offer') await handleIncomingOffer(payload);
                    else if (payload.type === 'answer') await handleIncomingAnswer(payload);
                    else if (payload.type === 'ice-candidate') await handleIncomingIceCandidate(payload);
                    else if (payload.type === 'end-call') cleanUpCallState();
                })
                .subscribe();
        }

        document.getElementById('start-call-btn').addEventListener('click', async () => {
            const targetUsername = document.getElementById('target-call-user').value.trim();
            if (!targetUsername) return alert("Please enter target username.");
            if (targetUsername === currentUser.username) return alert("You cannot call yourself.");

            activeCallTarget = targetUsername;
            document.getElementById('call-bar').classList.remove('hidden');
            document.getElementById('call-status').textContent = `Calling ${targetUsername}...`;

            playRingtone();

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                setupPeerConnection(targetUsername);

                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                sendSignalToUser(targetUsername, {
                    type: 'offer',
                    offer: offer,
                    callerUsername: currentUser.username
                });

            } catch (err) {
                alert("Microphone error: " + err.message);
                cleanUpCallState();
            }
        });

        async function handleIncomingOffer(payload) {
            if (dndToggle.checked) {
                sendSignalToUser(payload.callerUsername, { type: 'end-call' });
                return;
            }

            playRingtone();

            const accept = confirm(`Incoming call from ${payload.callerUsername}. Accept?`);
            stopRingtone();

            if (!accept) {
                sendSignalToUser(payload.callerUsername, { type: 'end-call' });
                return;
            }

            activeCallTarget = payload.callerUsername;
            document.getElementById('call-bar').classList.remove('hidden');
            document.getElementById('call-status').textContent = `In call with ${payload.callerUsername}`;

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                setupPeerConnection(payload.callerUsername);

                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.offer));

                while (iceCandidateQueue.length > 0) {
                    const cand = iceCandidateQueue.shift();
                    await peerConnection.addIceCandidate(cand);
                }

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                sendSignalToUser(payload.callerUsername, {
                    type: 'answer',
                    answer: answer
                });

            } catch (err) {
                alert("Call setup failed: " + err.message);
                cleanUpCallState();
            }
        }

        async function handleIncomingAnswer(payload) {
            stopRingtone();
            if (!peerConnection) return;

            await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.answer));
            document.getElementById('call-status').textContent = `In Call with ${activeCallTarget}`;

            while (iceCandidateQueue.length > 0) {
                const cand = iceCandidateQueue.shift();
                await peerConnection.addIceCandidate(cand);
            }
        }

        async function handleIncomingIceCandidate(payload) {
            const candidate = new RTCIceCandidate(payload.candidate);
            if (peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
                await peerConnection.addIceCandidate(candidate);
            } else {
                iceCandidateQueue.push(candidate);
            }
        }

        function setupPeerConnection(targetUsername) {
            peerConnection = new RTCPeerConnection(rtcConfig);

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    sendSignalToUser(targetUsername, {
                        type: 'ice-candidate',
                        candidate: event.candidate
                    });
                }
            };

            peerConnection.ontrack = (event) => {
                stopRingtone();
                const remoteAudio = document.getElementById('remote-audio');
                if (remoteAudio.srcObject !== event.streams[0]) {
                    remoteAudio.srcObject = event.streams[0];
                    remoteAudio.play().catch(e => console.warn("Autoplay block workaround:", e));
                }
            };
        }

        function sendSignalToUser(targetUsername, payload) {
            supabaseClient.channel(`user-signal:${targetUsername}`).send({
                type: 'broadcast',
                event: 'signal',
                payload: payload
            });
        }

        document.getElementById('end-call-btn').addEventListener('click', () => {
            if (activeCallTarget) {
                sendSignalToUser(activeCallTarget, { type: 'end-call' });
            }
            cleanUpCallState();
        });

        function cleanUpCallState() {
            stopRingtone();
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            iceCandidateQueue = [];
            activeCallTarget = null;
            document.getElementById('call-bar').classList.add('hidden');
        }

        function escapeHTML(str) { 
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); 
        }
    </script>
</body>
