<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Chat - Password Authentication</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #chat-box::-webkit-scrollbar { width: 6px; }
        #chat-box::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        #chat-box::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen flex flex-col font-sans overflow-hidden antialiased">

    <!-- Auth Modal (Username & Password Flow) -->
    <div id="auth-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-5">
            <div class="text-center">
                <h2 class="text-2xl font-black bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Mesh Network Access</h2>
                <p class="text-xs text-slate-400 mt-1" id="auth-subtitle">Sign in or create an account to continue</p>
            </div>
            
            <!-- Auth Form -->
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Username</label>
                    <input type="text" id="auth-username" required placeholder="Enter your username" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Password</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" id="login-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-xs font-bold py-2.5 rounded-lg transition-colors cursor-pointer">LOG IN</button>
                    <button type="button" id="signup-btn" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold py-2.5 rounded-lg transition-colors cursor-pointer">SIGN UP</button>
                </div>
            </form>

            <div id="auth-error" class="text-xs text-rose-400 hidden"></div>
        </div>
    </div>

    <!-- Active Call Bar -->
    <div id="call-bar" class="hidden bg-indigo-950/80 border-b border-indigo-500/30 px-6 py-3 flex items-center justify-between z-20">
        <div class="flex items-center gap-3">
            <span class="relative flex h-3 w-3">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            <span id="call-status" class="text-xs font-bold text-indigo-200">In Call...</span>
            <audio id="remote-audio" autoplay></audio>
        </div>
        <button id="end-call-btn" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-colors cursor-pointer">End Call</button>
    </div>

    <!-- Main Layout -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shrink-0 hidden md:flex">
            <div class="p-4 space-y-6">
                <div>
                    <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Channels</h2>
                    <nav class="space-y-1" id="channel-list">
                        <button data-channel="general" class="channel-btn w-full text-left px-3 py-2 rounded-lg text-xs font-semibold bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 flex items-center gap-2"># general</button>
                        <button data-channel="announcements" class="channel-btn w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-colors flex items-center gap-2"># announcements</button>
                        <button data-channel="dev-talk" class="channel-btn w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-colors flex items-center gap-2"># dev-talk</button>
                        <button data-channel="media" class="channel-btn w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-colors flex items-center gap-2"># media</button>
                        <button data-channel="off-topic" class="channel-btn w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-colors flex items-center gap-2"># off-topic</button>
                    </nav>
                </div>

                <div>
                    <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Direct Voice Call</h2>
                    <div class="space-y-2">
                        <input type="text" id="target-call-user" placeholder="Target Username..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                        <button id="start-call-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-1.5 rounded-lg transition-colors cursor-pointer">Call User</button>
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div id="user-avatar" class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold">?</div>
                    <span id="current-user-display" class="text-xs font-semibold text-slate-300 truncate max-w-[100px]">Guest</span>
                </div>
                <button id="logout-btn" class="text-xs text-slate-500 hover:text-slate-300 transition-colors cursor-pointer">Logout</button>
            </div>
        </aside>

        <!-- Chat Viewport -->
        <main class="flex-1 flex flex-col bg-slate-950">
            <header class="p-4 border-b border-slate-800 bg-slate-900/40 flex items-center justify-between">
                <h1 id="active-channel-title" class="text-sm font-bold text-slate-200"># general</h1>
            </header>

            <div id="chat-box" class="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4"></div>

            <!-- Reply Banner Container -->
            <div id="reply-preview" class="hidden bg-slate-900 border-t border-slate-800 px-4 py-2 flex items-center justify-between text-xs text-slate-400">
                <span>Replying to <b id="reply-target-user" class="text-indigo-400"></b>: "<span id="reply-target-text" class="italic truncate max-w-xs inline-block align-bottom"></span>"</span>
                <button id="cancel-reply-btn" class="text-slate-500 hover:text-slate-300 font-bold">&times;</button>
            </div>

            <footer class="p-4 bg-slate-900/80 border-t border-slate-800">
                <form id="chat-form" class="flex items-center gap-2">
                    <input type="text" id="msg-input" placeholder="Broadcast message..." autocomplete="off" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold uppercase px-5 py-2.5 rounded-xl transition-colors cursor-pointer">Send</button>
                </form>
            </footer>
        </main>
    </div>

    <script>
        // CONFIGURATION CONSTANTS
        const SUPABASE_URL = "https://wmxynxxbpxzfahqanfot.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_CFuOicrEE8nWiOUFEir3oQ_Chb7hnMt";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let activeChannel = 'general';
        let activeReplyId = null;
        let peerConnection = null;
        let localStream = null;
        let signalingChannel = null;

        // Elements
        const authModal = document.getElementById('auth-modal');
        const authError = document.getElementById('auth-error');
        const loginBtn = document.getElementById('login-btn');
        const signupBtn = document.getElementById('signup-btn');
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const msgInput = document.getElementById('msg-input');
        const replyPreview = document.getElementById('reply-preview');

        // --- PASSWORD AUTHENTICATION LOGIC ---

        // Helper: Hash password in browser using Web Crypto API
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Action: Sign Up
        signupBtn.addEventListener('click', async () => {
            authError.classList.add('hidden');
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value;

            if (!username || !password) return showAuthError("Username and password are required");
            if (password.length < 6) return showAuthError("Password must be at least 6 characters");

            // Check if username is taken
            const { data: existingUser } = await supabaseClient
                .from('profiles')
                .select('username')
                .eq('username', username)
                .maybeSingle();

            if (existingUser) {
                return showAuthError("Username is already taken. Please choose another.");
            }

            const passwordHash = await hashPassword(password);
            const userId = crypto.randomUUID();

            // Save new user profile with password hash
            const { error } = await supabaseClient
                .from('profiles')
                .insert([{ id: userId, username, password_hash: passwordHash }]);

            if (error) return showAuthError("Account creation failed: " + error.message);

            initAuthenticatedSession({ id: userId }, username);
        });

        // Action: Log In
        loginBtn.addEventListener('click', async () => {
            authError.classList.add('hidden');
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value;

            if (!username || !password) return showAuthError("Username and password are required");

            const passwordHash = await hashPassword(password);

            // Verify account details
            const { data: userProfile, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('username', username)
                .maybeSingle();

            if (error || !userProfile) {
                return showAuthError("Account not found. Please sign up.");
            }

            if (userProfile.password_hash !== passwordHash) {
                return showAuthError("Incorrect password. Please try again.");
            }

            initAuthenticatedSession({ id: userProfile.id }, userProfile.username);
        });

        function showAuthError(msg) {
            authError.textContent = msg;
            authError.classList.remove('hidden');
        }

        async function initAuthenticatedSession(user, username) {
            currentUser = { id: user.id, username };
            document.getElementById('current-user-display').textContent = username;
            document.getElementById('user-avatar').textContent = username.charAt(0).toUpperCase();
            authModal.classList.add('hidden');
            
            initSignalingChannel();
            loadChannelMessages();
            listenToRealtimeMessages();
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            window.location.reload();
        });

        // --- CHANNEL SWITCHING ---
        document.querySelectorAll('.channel-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.channel-btn').forEach(b => {
                    b.className = "channel-btn w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-colors flex items-center gap-2";
                });
                btn.className = "channel-btn w-full text-left px-3 py-2 rounded-lg text-xs font-semibold bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 flex items-center gap-2";
                
                activeChannel = btn.dataset.channel;
                document.getElementById('active-channel-title').textContent = `# ${activeChannel}`;
                loadChannelMessages();
            });
        });

        // --- CHAT & REPLIES ---
        async function loadChannelMessages() {
            chatBox.innerHTML = '';
            const { data } = await supabaseClient
                .from('chat_messages')
                .select('*')
                .eq('channel_id', activeChannel)
                .order('created_at', { ascending: true })
                .limit(100);

            if (data) data.forEach(msg => appendMessageUI(msg));
        }

        function appendMessageUI(msg) {
            const msgEl = document.createElement('div');
            msgEl.className = "p-3 bg-slate-900/50 border border-slate-800/80 rounded-xl space-y-1 relative group";

            let replyHeader = '';
            if (msg.reply_to_id) {
                replyHeader = `<div class="text-[10px] text-indigo-400 font-mono">Replying to message #${msg.reply_to_id}</div>`;
            }

            msgEl.innerHTML = `
                ${replyHeader}
                <div class="flex justify-between items-center text-xs">
                    <span class="font-bold text-slate-200">${escapeHTML(msg.username)}</span>
                    <span class="text-[10px] text-slate-500">${new Date(msg.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                </div>
                <p class="text-xs text-slate-300 leading-relaxed">${escapeHTML(msg.message)}</p>
                <button onclick="setReplyTarget(${msg.id}, '${escapeHTML(msg.username)}', '${escapeHTML(msg.message)}')" class="opacity-0 group-hover:opacity-100 absolute top-2 right-2 text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded transition-opacity">Reply</button>
            `;
            chatBox.appendChild(msgEl);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setReplyTarget(id, username, text) {
            activeReplyId = id;
            document.getElementById('reply-target-user').textContent = username;
            document.getElementById('reply-target-text').textContent = text;
            replyPreview.classList.remove('hidden');
        }

        document.getElementById('cancel-reply-btn').addEventListener('click', () => {
            activeReplyId = null;
            replyPreview.classList.add('hidden');
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if (!text || !currentUser) return;

            const payload = {
                user_id: currentUser.id,
                username: currentUser.username,
                channel_id: activeChannel,
                message: text,
                reply_to_id: activeReplyId
            };

            msgInput.value = '';
            activeReplyId = null;
            replyPreview.classList.add('hidden');

            await supabaseClient.from('chat_messages').insert([payload]);
        });

        function listenToRealtimeMessages() {
            supabaseClient
                .channel('public:chat_messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
                    if (payload.new.channel_id === activeChannel) {
                        appendMessageUI(payload.new);
                    }
                }).subscribe();
        }

        // --- WEBRTC CALLING ---
        function initSignalingChannel() {
            signalingChannel = supabaseClient.channel(`signaling:${currentUser.username}`);
            signalingChannel.on('broadcast', { event: 'signal' }, async ({ payload }) => {
                if (payload.type === 'offer') handleIncomingOffer(payload);
                else if (payload.type === 'answer') peerConnection?.setRemoteDescription(new RTCSessionDescription(payload.answer));
                else if (payload.type === 'ice-candidate') peerConnection?.addIceCandidate(new RTCIceCandidate(payload.candidate));
            }).subscribe();
        }

        document.getElementById('start-call-btn').addEventListener('click', async () => {
            const targetUser = document.getElementById('target-call-user').value.trim();
            if (!targetUser) return alert("Enter target username");

            setupPeerConnection(targetUser);
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            sendSignal(targetUser, { type: 'offer', offer, from: currentUser.username });
            document.getElementById('call-bar').classList.remove('hidden');
            document.getElementById('call-status').textContent = `Calling ${targetUser}...`;
        });

        async function handleIncomingOffer(payload) {
            if (!confirm(`Incoming audio call from ${payload.from}. Accept?`)) return;

            setupPeerConnection(payload.from);
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            sendSignal(payload.from, { type: 'answer', answer });
            document.getElementById('call-bar').classList.remove('hidden');
            document.getElementById('call-status').textContent = `In Call with ${payload.from}`;
        }

        function setupPeerConnection(targetUser) {
            peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    sendSignal(targetUser, { type: 'ice-candidate', candidate: event.candidate });
                }
            };

            peerConnection.ontrack = (event) => {
                document.getElementById('remote-audio').srcObject = event.streams[0];
            };
        }

        function sendSignal(targetUsername, payload) {
            supabaseClient.channel(`signaling:${targetUsername}`).send({
                type: 'broadcast',
                event: 'signal',
                payload
            });
        }

        document.getElementById('end-call-btn').addEventListener('click', () => {
            peerConnection?.close();
            localStream?.getTracks().forEach(t => t.stop());
            document.getElementById('call-bar').classList.add('hidden');
        });

        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
    </script>
</body>
</html>
