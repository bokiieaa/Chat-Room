<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Public Chatroom</title>
    <!-- Modern Tailwind CSS v4 Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase Core Client Library SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>

        .maintenance-banner {
            background-color: #d9534f; /* Solid red color */
            color: white;
            text-align: center;
            padding: 15px 10px;
            font-size: 1.25rem;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        
        /* Smooth glowing animation for the active indicators */
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }
        .live-dot { animation: pulse-glow 2s infinite ease-in-out; }
        
        /* Custom styled minimalist scrollbar */
        #chat-box::-webkit-scrollbar { width: 6px; }
        #chat-box::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
        #chat-box::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 9999px; }
        #chat-box::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen flex flex-col items-center justify-center p-3 sm:p-6 antialiased font-sans selection:bg-indigo-500/30 selection:text-indigo-200">

    <!-- Main Container with Glassmorphism blur effects -->
    <div class="w-full max-w-2xl bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl flex flex-col h-[85vh] overflow-hidden">
        
        <!-- App Header Bar -->
        <header class="p-4 sm:p-5 border-b border-slate-800 bg-slate-900/80 flex items-center justify-between z-10">
            <div class="flex items-center gap-3">
                <div class="relative flex h-3 w-3">
                    <span class="live-dot absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-tight bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">Global Mesh Room</h1>
                    <p class="text-[11px] text-slate-400 font-medium tracking-wide uppercase">Static Node Realtime Feed</p>
                </div>
            </div>
            
            <!-- User Status Pill -->
            <div class="flex items-center gap-2 bg-slate-950/60 border border-slate-800/80 rounded-full px-3 py-1.5 shadow-inner">
                <div id="avatar-circle" class="w-5 h-5 rounded-full bg-indigo-600 flex items-center justify-center text-[10px] font-black uppercase text-white shadow-md"></div>
                <span id="user-display" class="text-xs font-semibold text-slate-300 max-w-[120px] truncate">Connecting...</span>
            </div>
        </header>

        <!-- Message Pipeline Screen Stream Container -->
        <div id="chat-box" class="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4 bg-slate-950/20 shadow-inner">
            <div id="loading-placeholder" class="h-full w-full flex flex-col items-center justify-center space-y-3">
                <div class="w-8 h-8 border-2 border-indigo-500/20 border-t-indigo-400 rounded-full animate-spin"></div>
                <p class="text-xs text-slate-400 font-medium tracking-wide animate-pulse">Syncing secure transaction logs...</p>
            </div>
        </div>

        <!-- Message Processing Action Bar Footer -->
        <footer class="p-3 sm:p-4 bg-slate-900/90 border-t border-slate-800">
            <form id="chat-form" class="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl p-1 focus-within:border-indigo-500/50 focus-within:ring-2 focus-within:ring-indigo-500/10 transition-all duration-300">
                <input type="text" id="msg-input" placeholder="Broadcasting a safe encrypted packet..." required autocomplete="off" max="500"
                       class="flex-1 bg-transparent border-0 px-3 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-0">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-bold uppercase tracking-wider px-5 py-2.5 rounded-lg shadow-lg shadow-indigo-600/20 transition-all duration-200 cursor-pointer">
                    Send
                </button>
            </form>
        </footer>
    </div>

    <script>
        const SUPABASE_URL = "https://wmxynxxbpxzfahqanfot.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_CFuOicrEE8nWiOUFEir3oQ_Chb7hnMt";
        
        // Initialize the cloud gateway connection layer mapping
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUsername = "";
        let currentIp = "Unknown";
        let loadedMessageIds = new Set(); // Prevents duplication anomalies

        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const msgInput = document.getElementById('msg-input');
        const userDisplay = document.getElementById('user-display');
        const avatarCircle = document.getElementById('avatar-circle');

        // 1. Prompt Setup & Secure IP Identifier Request
        async function initUser() {
            currentUsername = prompt("Enter public chat handle:") || "anonymous_" + Math.floor(Math.random() * 9000 + 1000);
            userDisplay.textContent = currentUsername;
            avatarCircle.textContent = currentUsername.charAt(0);

            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                currentIp = data.ip || "Unknown";
            } catch (err) {
                currentIp = "Unknown";
            }

            // Sync state and boot pipeline view
            loadHistory();
            listenForNewMessages();
        }

        // 2. Fetch the last 50 historical logs chronologically
        async function loadHistory() {
            const { data, error } = await supabaseClient
                .from('chat_messages')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(5000000);

            if (error) {
                chatBox.innerHTML = `
                    <div class="h-full w-full flex flex-col items-center justify-center text-center p-6">
                        <div class="text-rose-500/20 text-4xl mb-2">⚠️</div>
                        <p class="text-sm font-semibold text-rose-400">Node Cluster Failure</p>
                        <p class="text-xs text-slate-500 max-w-xs mt-1">${error.message}</p>
                    </div>`;
                return;
            }

            chatBox.innerHTML = ''; // Wipe loading view completely
            
            if (data.length === 0) {
                showEmptyPlaceholder();
            } else {
                data.forEach(msg => appendMessage(msg));
            }
            scrollToBottom();
        }

        // 3. UI DOM Rendering Engine (Appends chronologically to bottom)
        function appendMessage(msg) {
            // Drop duplication loops
            if (loadedMessageIds.has(msg.id)) return;
            loadedMessageIds.add(msg.id);

            // Strip static placeholder text if it's currently showing
            const placeholder = document.getElementById('empty-placeholder');
            if (placeholder) placeholder.remove();

            const msgEl = document.createElement('div');
            const isMe = msg.username === currentUsername;
            const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            msgEl.className = "flex gap-3 items-start animate-fade-in group w-full";
            msgEl.innerHTML = `
                <div class="w-8 h-8 rounded-lg shrink-0 flex items-center justify-center text-xs font-bold uppercase tracking-wider text-slate-200 border select-none ${isMe ? 'bg-indigo-600/20 border-indigo-500/30' : 'bg-slate-800/80 border-slate-700/60'}">
                    ${escapeHTML(msg.username.charAt(0))}
                </div>
                <div class="flex-1 min-w-0 bg-slate-900/40 border border-slate-800/80 rounded-xl px-4 py-3 shadow-sm hover:border-slate-700/50 transition-colors duration-200">
                    <div class="flex flex-wrap justify-between items-center gap-x-2 gap-y-0.5 mb-1.5">
                        <span class="text-xs font-semibold text-slate-200 truncate ${isMe ? 'text-indigo-400' : 'text-slate-300'}">${escapeHTML(msg.username)}</span>
                        <div class="flex items-center gap-2 text-[10px] text-slate-500 font-mono tracking-tight">
                            <span class="bg-slate-950 px-1.5 py-0.5 border border-slate-800/60 rounded text-slate-400 group-hover:text-indigo-400 transition-colors duration-200">IP: ${escapeHTML(msg.ip_address)}</span>
                            <span>${time}</span>
                        </div>
                    </div>
                    <p class="text-sm text-slate-300 leading-relaxed break-words whitespace-pre-wrap">${escapeHTML(msg.message)}</p>
                </div>
            `;
            
            // Appends directly to the base bottom of the chat window box element
            chatBox.appendChild(msgEl);
        }

        function showEmptyPlaceholder() {
            chatBox.innerHTML = `
                <div id="empty-placeholder" class="h-full w-full flex flex-col items-center justify-center text-center p-6">
                    <p class="text-xs font-medium text-slate-500 tracking-wide uppercase">No communication history packets found.</p>
                    <p class="text-[11px] text-slate-600 mt-0.5">Be the first to transmit a message string broadcast.</p>
                </div>`;
        }

        // 4. Submit Transaction Payload Request Handler
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = msgInput.value.trim();
            if (!messageText) return;

            msgInput.value = ''; // Instantly refresh buffer input for responsive client feel

            const { error } = await supabaseClient
                .from('chat_messages')
                .insert([{ 
                    username: currentUsername, 
                    message: messageText, 
                    ip_address: currentIp 
                }]);

            if (error) alert("Write transaction rejected: " + error.message);
        });

        // 5. Connect Realtime WebSocket Postgres Mutation Broadcast Hooks
        function listenForNewMessages() {
            supabaseClient
                .channel('public:chat_messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
                    // Safe append incoming insertion packets straight into bottom view
                    appendMessage(payload.new);
                    scrollToBottom();
                })
                .subscribe();
        }

        // System Utility Helpers
        function scrollToBottom() { chatBox.scrollTop = chatBox.scrollHeight; }
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

        // Boot execution thread
        initUser();
    </script>
    
    <div class="maintenance-banner">
        FIXING BUG RN, COME BACK LATER.
    </div>
</body>
</html>
