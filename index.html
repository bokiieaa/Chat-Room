<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mesh Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex flex-col">

  <!-- AUTH SECTION -->
  <div id="authContainer" class="flex-1 flex items-center justify-center p-4">
    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
      <h1 class="text-3xl font-bold text-center mb-6 text-indigo-400">💬 Mesh Chat</h1>
      <div id="authError" class="hidden mb-4 p-3 bg-red-900/50 border border-red-500 text-red-200 rounded text-sm text-center"></div>
      <form id="authForm" onsubmit="return false;" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1 text-gray-300">Username</label>
          <input type="text" id="authUsername" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded focus:outline-none focus:border-indigo-500" placeholder="e.g. alex" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1 text-gray-300">Password</label>
          <input type="password" id="authPassword" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded focus:outline-none focus:border-indigo-500" placeholder="••••••••" />
        </div>
        <div class="flex gap-4 pt-2">
          <button id="loginBtn" onclick="handleAuth('login')" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded transition">Log In</button>
          <button id="signupBtn" onclick="handleAuth('signup')" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 rounded transition">Sign Up</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MAIN CHAT APP (Hidden until logged in) -->
  <div id="appContainer" class="hidden flex-1 flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
      <div class="p-4 border-b border-gray-700 flex justify-between items-center">
        <span id="currentUserDisplay" class="font-bold text-indigo-400 truncate"></span>
        <button onclick="logout()" class="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-gray-300">Logout</button>
      </div>
      <div class="p-4 flex-1 overflow-y-auto">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Channels</h2>
        <nav class="space-y-1">
          <button onclick="switchChannel('general')" class="channel-btn w-full text-left px-3 py-2 rounded text-gray-300 hover:bg-gray-700 active-channel" data-channel="general"># general</button>
          <button onclick="switchChannel('dev-talk')" class="channel-btn w-full text-left px-3 py-2 rounded text-gray-300 hover:bg-gray-700" data-channel="dev-talk"># dev-talk</button>
          <button onclick="switchChannel('off-topic')" class="channel-btn w-full text-left px-3 py-2 rounded text-gray-300 hover:bg-gray-700" data-channel="off-topic"># off-topic</button>
        </nav>
      </div>
    </aside>

    <!-- Main Chat Window -->
    <main class="flex-1 flex flex-col bg-gray-900">
      <!-- Chat Header -->
      <header class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-800">
        <h2 id="channelHeader" class="text-lg font-bold text-gray-100"># general</h2>
        <button id="callBtn" onclick="startCall()" class="bg-green-600 hover:bg-green-500 text-white text-sm px-4 py-2 rounded flex items-center gap-2 transition">
          📞 Start Audio Call
        </button>
      </header>

      <!-- Active Call Bar (Hidden by default) -->
      <div id="callBar" class="hidden bg-indigo-900/50 border-b border-indigo-500 p-3 flex items-center justify-between">
        <span id="callStatus" class="text-sm font-medium text-indigo-200">Connecting call...</span>
        <button onclick="endCall()" class="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1 rounded">End Call</button>
      </div>

      <!-- Messages Stream -->
      <div id="messagesList" class="flex-1 p-4 overflow-y-auto space-y-4"></div>

      <!-- Reply Banner -->
      <div id="replyBanner" class="hidden px-4 py-2 bg-gray-800 border-t border-gray-700 flex justify-between items-center text-xs text-indigo-300">
        <span id="replyText">Replying to...</span>
        <button onclick="cancelReply()" class="text-gray-400 hover:text-white">✕</button>
      </div>

      <!-- Message Input Form -->
      <form id="messageForm" onsubmit="sendMessage(event)" class="p-4 border-t border-gray-700 bg-gray-800 flex gap-2">
        <input type="text" id="messageInput" required class="flex-1 px-4 py-2 bg-gray-700 border border-gray-600 rounded focus:outline-none focus:border-indigo-500 text-white" placeholder="Message #general..." />
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-2 rounded transition">Send</button>
      </form>
    </main>
  </div>

  <audio id="remoteAudio" autoplay></audio>

  <script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = "https://wmxynxxbpxzfahqanfot.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_CFuOicrEE8nWiOUFEir3oQ_Chb7hnMt";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // App State
    let currentUser = null;
    let currentChannel = 'general';
    let replyingToId = null;
    let messagesSubscription = null;
    let callSubscription = null;

    // WebRTC State
    let peerConnection = null;
    let localStream = null;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // --- HELPER: SHA-256 HASHING ---
    async function hashPassword(password) {
      const msgUint8 = new TextEncoder().encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // --- AUTHENTICATION ---
    async function handleAuth(type) {
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value;
      const errorEl = document.getElementById('authError');
      errorEl.classList.add('hidden');

      if (!username || !password) return;

      const passwordHash = await hashPassword(password);

      try {
        if (type === 'signup') {
          const userId = crypto.randomUUID();
          const { data, error } = await supabase.from('profiles').insert([
            { id: userId, username, password_hash: passwordHash }
          ]).select().single();

          if (error) throw error;
          currentUser = data;
        } else {
          const { data, error } = await supabase.from('profiles')
            .select('*')
            .eq('username', username)
            .eq('password_hash', passwordHash)
            .single();

          if (error || !data) throw new Error('Invalid username or password');
          currentUser = data;
        }

        initApp();
      } catch (err) {
        errorEl.textContent = err.message || 'Authentication failed';
        errorEl.classList.remove('hidden');
      }
    }

    function initApp() {
      document.getElementById('authContainer').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
      document.getElementById('currentUserDisplay').textContent = `@${currentUser.username}`;
      
      setupCallListener();
      switchChannel('general');
    }

    function logout() {
      if (peerConnection) endCall();
      location.reload();
    }

    // --- CHAT FUNCTIONS ---
    async function switchChannel(channel) {
      currentChannel = channel;
      document.getElementById('channelHeader').textContent = `# ${channel}`;
      document.getElementById('messageInput').placeholder = `Message #${channel}...`;

      document.querySelectorAll('.channel-btn').forEach(btn => {
        if (btn.dataset.channel === channel) {
          btn.classList.add('bg-gray-700', 'font-bold');
        } else {
          btn.classList.remove('bg-gray-700', 'font-bold');
        }
      });

      fetchMessages();
      subscribeToMessages();
    }

    async function fetchMessages() {
      const { data, error } = await supabase
        .from('chat_messages')
        .select('*')
        .eq('channel_id', currentChannel)
        .order('created_at', { ascending: true });

      if (!error) renderMessages(data || []);
    }

    function subscribeToMessages() {
      if (messagesSubscription) supabase.removeChannel(messagesSubscription);

      messagesSubscription = supabase
        .channel(`messages_${currentChannel}`)
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'chat_messages',
          filter: `channel_id=eq.${currentChannel}`
        }, payload => {
          appendMessage(payload.new);
        })
        .subscribe();
    }

    function renderMessages(messages) {
      const container = document.getElementById('messagesList');
      container.innerHTML = '';
      messages.forEach(msg => appendMessage(msg));
      container.scrollTop = container.scrollHeight;
    }

    function appendMessage(msg) {
      const container = document.getElementById('messagesList');
      const msgEl = document.createElement('div');
      msgEl.className = 'bg-gray-800 p-3 rounded-lg border border-gray-700 relative group';
      
      const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      msgEl.innerHTML = `
        <div class="flex items-center justify-between mb-1">
          <span class="font-bold text-indigo-400 text-sm">${escapeHtml(msg.username)}</span>
          <span class="text-xs text-gray-500">${time}</span>
        </div>
        <p class="text-gray-200 text-sm">${escapeHtml(msg.message)}</p>
        <button onclick="setReply(${msg.id}, '${escapeHtml(msg.username)}')" class="absolute top-2 right-2 text-xs text-gray-400 hover:text-indigo-300 opacity-0 group-hover:opacity-100 transition">Reply</button>
      `;

      container.appendChild(msgEl);
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const payload = {
        user_id: currentUser.id,
        username: currentUser.username,
        channel_id: currentChannel,
        message: text,
        reply_to_id: replyingToId
      };

      input.value = '';
      cancelReply();

      await supabase.from('chat_messages').insert([payload]);
    }

    function setReply(id, username) {
      replyingToId = id;
      document.getElementById('replyText').textContent = `Replying to @${username}`;
      document.getElementById('replyBanner').classList.remove('hidden');
    }

    function cancelReply() {
      replyingToId = null;
      document.getElementById('replyBanner').classList.add('hidden');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // --- WEBRTC SIGNALING & CALLING ---
    function setupCallListener() {
      callSubscription = supabase.channel(`call_signaling_${currentChannel}`, {
        config: { broadcast: { self: false } }
      });

      callSubscription
        .on('broadcast', { event: 'signal' }, payload => handleSignal(payload.payload))
        .subscribe();
    }

    async function startCall() {
      document.getElementById('callBar').classList.remove('hidden');
      document.getElementById('callStatus').textContent = 'Calling channel...';

      peerConnection = new RTCPeerConnection(rtcConfig);
      setupPeerEvents();

      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      sendSignal({ type: 'offer', offer, sender: currentUser.username });
    }

    async function handleSignal(data) {
      if (data.type === 'offer') {
        if (!confirm(`Incoming call from @${data.sender}. Accept?`)) return;

        document.getElementById('callBar').classList.remove('hidden');
        document.getElementById('callStatus').textContent = `In call with @${data.sender}`;

        peerConnection = new RTCPeerConnection(rtcConfig);
        setupPeerEvents();

        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        sendSignal({ type: 'answer', answer });
      } else if (data.type === 'answer' && peerConnection) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        document.getElementById('callStatus').textContent = 'Connected';
      } else if (data.type === 'candidate' && peerConnection) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
      } else if (data.type === 'hangup') {
        endCall(false);
      }
    }

    function setupPeerEvents() {
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          sendSignal({ type: 'candidate', candidate: event.candidate });
        }
      };

      peerConnection.ontrack = (event) => {
        const audioEl = document.getElementById('remoteAudio');
        audioEl.srcObject = event.streams[0];
      };
    }

    function sendSignal(payload) {
      callSubscription.send({
        type: 'broadcast',
        event: 'signal',
        payload
      });
    }

    function endCall(notifyPeer = true) {
      if (notifyPeer && callSubscription) {
        sendSignal({ type: 'hangup' });
      }

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      document.getElementById('callBar').classList.add('hidden');
    }
  </script>
</body>
</html>
