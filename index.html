<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Public Chatroom</title>
    <!-- Tailwind CSS for styling layout elements -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS CDN Library for database operations -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white rounded-lg shadow-md flex flex-col h-[80vh]">
        <!-- Header -->
        <div class="p-4 bg-blue-600 text-white font-bold rounded-t-lg flex justify-between items-center">
            <span>Public Chatroom</span>
            <span id="user-display" class="text-xs bg-blue-700 px-2 py-1 rounded"></span>
        </div>

        <!-- Chat History Window -->
        <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50 text-sm">
            <p class="text-gray-400 text-center italic">Loading chat history...</p>
        </div>

        <!-- Message Input Form -->
        <form id="chat-form" class="p-4 border-t border-gray-200 flex gap-2">
            <input type="text" id="msg-input" placeholder="Type a message..." required autocomplete="off"
                   class="flex-1 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-blue-500">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Send</button>
        </form>
    </div>

    <script>
        // CONFIGURATION: Replace with your actual project connection details
        const SUPABASE_URL = "https://wmxynxxbpxzfahqanfot.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndteHlueHhicHh6ZmFocWFuZm90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNDA5MjMsImV4cCI6MjEwNTcxNjkyM30.qlSD7EjNEMQrjLoem81ewLln9l2ASpubwqdbkaT4v0s";
        
        // Initialize the client connection mapping
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUsername = "";
        let currentIp = "Unknown";

        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const msgInput = document.getElementById('msg-input');
        const userDisplay = document.getElementById('user-display');

        // 1. Initial Prompt Setup & Secure IP Identifier Request
        async function initUser() {
            // Prompt for identity
            currentUsername = prompt("Enter your username:") || "Anonymous_" + Math.floor(Math.random() * 1000);
            userDisplay.textContent = `As: ${currentUsername}`;

            // Fetch visitor public IP safely from a free external API endpoint
            try {
                const response = await fetch('https://ipify.org');
                const data = await response.json();
                currentIp = data.ip;
            } catch (err) {
                console.error("IP Logging service error: ", err);
            }

            // Sync state and bootstrap view
            loadHistory();
            listenForNewMessages();
        }

        // 2. Fetch the latest historical chat timeline records from Postgres
        async function loadHistory() {
            const { data, error } = await supabase
                .from('chat_messages')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(50);

            if (error) {
                chatBox.innerHTML = `<p class="text-red-500 text-center">Error fetching remote logs.</p>`;
                return;
            }

            chatBox.innerHTML = ''; // Wipe loading placeholder
            data.forEach(msg => appendMessage(msg));
            scrollToBottom();
        }

        // 3. UI DOM Rendering Engine Component
        function appendMessage(msg) {
            const msgEl = document.createElement('div');
            msgEl.className = "p-2 rounded bg-white shadow-xs border border-gray-100";
            
            // Generate simple localized timeline tag format
            const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            msgEl.innerHTML = `
                <div class="flex justify-between items-baseline mb-1">
                    <span class="font-semibold text-blue-700">${escapeHTML(msg.username)}</span>
                    <span class="text-[10px] text-gray-400 font-mono">IP: ${escapeHTML(msg.ip_address)} | ${time}</span>
                </div>
                <p class="text-gray-700 break-words">${escapeHTML(msg.message)}</p>
            `;
            chatBox.appendChild(msgEl);
        }

        // 4. Submit Transaction Request Handler
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = msgInput.value.trim();
            if (!messageText) return;

            msgInput.value = ''; // Clean input immediately for UX snappiness

            const { error } = await supabase
                .from('chat_messages')
                .insert([{ 
                    username: currentUsername, 
                    message: messageText, 
                    ip_address: currentIp 
                }]);

            if (error) alert("Write command rejected: " + error.message);
        });

        // 5. Connect live PostgreSQL real-time tracking hooks
        function listenForNewMessages() {
            supabase
                .channel('public:chat_messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
                    appendMessage(payload.new);
                    scrollToBottom();
                })
                .subscribe();
        }

        // Utilities
        function scrollToBottom() { chatBox.scrollTop = chatBox.scrollHeight; }
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

        // Start initialization routine
        initUser();
    </script>
</body>
</html>
