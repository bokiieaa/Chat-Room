<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord P2P Web App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #313338; color: #dbdee1; display: flex; height: 100vh; overflow: hidden; }
    
    .sidebar { width: 240px; background-color: #2b2d31; display: flex; flex-direction: column; border-right: 1px solid #1f2023; }
    .server-header { padding: 16px; font-weight: 700; color: #f2f3f5; border-bottom: 1px solid #1f2023; font-size: 15px; }
    .channel-list { flex: 1; overflow-y: auto; padding: 10px 8px; }
    .section-label { font-size: 11px; font-weight: 700; color: #949ba4; text-transform: uppercase; margin: 12px 8px 4px; }
    
    .channel { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; color: #949ba4; cursor: pointer; font-size: 14px; font-weight: 500; margin-bottom: 2px; }
    .channel:hover { background-color: #35373c; color: #dbdee1; }
    .channel.active { background-color: #404249; color: #ffffff; }
    
    .main-content { flex: 1; display: flex; flex-direction: column; background-color: #313338; }
    .chat-header { height: 52px; border-bottom: 1px solid #1f2023; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: 600; color: #f2f3f5; }
    
    .chat-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { display: flex; flex-direction: column; }
    .msg-author { font-size: 13px; font-weight: 600; color: #38bdf8; margin-bottom: 2px; }
    .msg-content { font-size: 14px; color: #dbdee1; line-height: 1.4; }
    
    .input-container { padding: 16px; background-color: #313338; }
    .input-box { width: 100%; background-color: #383a40; border: none; border-radius: 8px; padding: 12px 16px; color: #dcddde; font-size: 14px; outline: none; }
    
    .vc-bar { background-color: #232428; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #1f2023; }
    .vc-info { font-size: 12px; color: #23a55a; font-weight: 600; }
    .btn { background-color: #5865f2; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn:hover { background-color: #4752c4; }
    .btn-danger { background-color: #da373c; }
    .btn-danger:hover { background-color: #a1282c; }
    
    .user-controls { display: flex; align-items: center; gap: 8px; }
    .username-badge { font-size: 12px; background: #1e1f22; padding: 4px 8px; border-radius: 4px; color: #f2f3f5; cursor: pointer; }
    .id-tag { font-size: 11px; color: #949ba4; background: #1e1f22; padding: 4px 8px; border-radius: 4px; user-select: all; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="server-header">P2P Mesh Server</div>
    <div class="channel-list">
      <div class="section-label">Text Channels</div>
      <div class="channel active" onclick="switchChannel('general', this)"># general</div>
      <div class="channel" onclick="switchChannel('announcements', this)"># announcements</div>
      <div class="channel" onclick="switchChannel('off-topic', this)"># off-topic</div>

      <div class="section-label" style="margin-top: 16px;">Voice Channels</div>
      <div class="channel" onclick="joinVoice('Lounge 1', this)">🔊 Lounge 1</div>
      <div class="channel" onclick="joinVoice('Lounge 2', this)">🔊 Lounge 2</div>
      <div class="channel" onclick="joinVoice('Lounge 3', this)">🔊 Lounge 3</div>
      <div class="channel" onclick="joinVoice('Lounge 4', this)">🔊 Lounge 4</div>
      <div class="channel" onclick="joinVoice('Lounge 5', this)">🔊 Lounge 5</div>
    </div>
    
    <div class="vc-bar" id="vc-bar" style="display: none;">
      <div>
        <div class="vc-info">Voice Connected</div>
        <div id="vc-channel-name" style="font-size: 11px; color: #949ba4;">Lounge 1</div>
      </div>
      <button class="btn btn-danger" onclick="leaveVoice()">Disconnect</button>
    </div>
  </div>

  <div class="main-content">
    <div class="chat-header">
      <span id="current-channel-title"># general</span>
      <div class="user-controls">
        <span class="username-badge" id="user-display" onclick="changeUsername()">User: Setting up...</span>
        <span class="id-tag" id="my-id">Connecting...</span>
        <button class="btn" onclick="connectPeerPrompt()">Connect Room</button>
      </div>
    </div>

    <div class="chat-area" id="chat-area"></div>

    <div class="input-container">
      <input type="text" class="input-box" id="msg-input" placeholder="Message #general" onkeydown="if(event.key==='Enter') sendMsg()" />
    </div>
  </div>

  <div id="audio-container"></div>

  <script>
    let myUsername = localStorage.getItem('p2p_username') || `User_${Math.floor(1000 + Math.random() * 9000)}`;
    const peer = new Peer();
    let connections = {};
    let activeCalls = {};
    let localAudioStream = null;
    let currentChannel = 'general';
    let currentVc = null;

    const chats = {
      'general': JSON.parse(localStorage.getItem('chat_general') || '[]'),
      'announcements': JSON.parse(localStorage.getItem('chat_announcements') || '[]'),
      'off-topic': JSON.parse(localStorage.getItem('chat_off-topic') || '[]')
    };

    peer.on('open', (id) => {
      document.getElementById('my-id').innerText = `ID: ${id}`;
      updateUserDisplay();
      renderMessages();
      checkUrlParams();
    });

    peer.on('connection', (conn) => {
      setupDataConn(conn);
    });

    peer.on('call', (call) => {
      if (localAudioStream) {
        call.answer(localAudioStream);
        handleCallStream(call);
      }
    });

    function updateUserDisplay() {
      document.getElementById('user-display').innerText = `👤 ${myUsername}`;
    }

    function changeUsername() {
      const name = prompt("Enter your new username:", myUsername);
      if (name && name.trim()) {
        myUsername = name.trim();
        localStorage.setItem('p2p_username', myUsername);
        updateUserDisplay();
      }
    }

    function connectPeerPrompt() {
      let targetId = prompt("Enter host peer ID or link:");
      if (!targetId) return;
      if (targetId.includes('?peer=')) {
        targetId = targetId.split('?peer=')[1];
      }
      connectToPeer(targetId);
    }

    function connectToPeer(targetId) {
      if (targetId === peer.id || connections[targetId]) return;
      const conn = peer.connect(targetId);
      setupDataConn(conn);
    }

    function setupDataConn(conn) {
      conn.on('open', () => {
        connections[conn.peer] = conn;
        appendSystem(`Connected to peer: ${conn.peer.substring(0, 5)}`);
        
        const knownPeers = Object.keys(connections);
        conn.send({ type: 'peer-discovery', peers: [peer.id, ...knownPeers] });

        if (localAudioStream) {
          const call = peer.call(conn.peer, localAudioStream);
          handleCallStream(call);
        }
      });

      conn.on('data', (data) => {
        if (data.type === 'peer-discovery') {
          data.peers.forEach(id => {
            if (id !== peer.id && !connections[id]) {
              connectToPeer(id);
            }
          });
        } else if (data.type === 'msg') {
          saveAndRenderMsg(data.channel, data.author, data.text);
        }
      });

      conn.on('close', () => {
        delete connections[conn.peer];
        appendSystem(`Peer disconnected.`);
      });
    }

    function switchChannel(name, el) {
      document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      currentChannel = name;
      document.getElementById('current-channel-title').innerText = `# ${name}`;
      document.getElementById('msg-input').placeholder = `Message #${name}`;
      renderMessages();
    }

    function sendMsg() {
      const input = document.getElementById('msg-input');
      const val = input.value.trim();
      if (!val) return;

      const payload = { 
        type: 'msg', 
        channel: currentChannel, 
        author: myUsername, 
        text: val 
      };
      
      Object.values(connections).forEach(conn => {
        if (conn.open) conn.send(payload);
      });
      
      saveAndRenderMsg(currentChannel, `${myUsername} (You)`, val);
      input.value = '';
    }

    function saveAndRenderMsg(channel, author, text) {
      if (!chats[channel]) chats[channel] = [];
      chats[channel].push({ author, text });
      localStorage.setItem(`chat_${channel}`, JSON.stringify(chats[channel]));
      if (channel === currentChannel) renderMessages();
    }

    function renderMessages() {
      const area = document.getElementById('chat-area');
      area.innerHTML = '';
      (chats[currentChannel] || []).forEach(m => {
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `<div class="msg-author">${m.author}</div><div class="msg-content">${m.text}</div>`;
        area.appendChild(div);
      });
      area.scrollTop = area.scrollHeight;
    }

    function appendSystem(text) {
      const area = document.getElementById('chat-area');
      const div = document.createElement('div');
      div.style.color = '#949ba4';
      div.style.fontSize = '12px';
      div.style.margin = '4px 0';
      div.innerText = text;
      area.appendChild(div);
      area.scrollTop = area.scrollHeight;
    }

    async function joinVoice(channelName, el) {
      if (currentVc === channelName) return;
      leaveVoice();
      
      try {
        localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        currentVc = channelName;
        document.getElementById('vc-bar').style.display = 'flex';
        document.getElementById('vc-channel-name').innerText = channelName;

        Object.keys(connections).forEach(peerId => {
          const call = peer.call(peerId, localAudioStream);
          handleCallStream(call);
        });
      } catch (err) {
        alert("Microphone permission required for voice channels.");
      }
    }

    function handleCallStream(call) {
      activeCalls[call.peer] = call;
      call.on('stream', (remoteStream) => {
        let audio = document.getElementById(`audio-${call.peer}`);
        if (!audio) {
          audio = document.createElement('audio');
          audio.id = `audio-${call.peer}`;
          audio.autoplay = true;
          document.getElementById('audio-container').appendChild(audio);
        }
        audio.srcObject = remoteStream;
      });
      
      call.on('close', () => {
        const audio = document.getElementById(`audio-${call.peer}`);
        if (audio) audio.remove();
        delete activeCalls[call.peer];
      });
    }

    function leaveVoice() {
      if (localAudioStream) {
        localAudioStream.getTracks().forEach(track => track.stop());
        localAudioStream = null;
      }
      Object.values(activeCalls).forEach(call => call.close());
      activeCalls = {};
      document.getElementById('audio-container').innerHTML = '';
      document.getElementById('vc-bar').style.display = 'none';
      currentVc = null;
    }

    function checkUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const peerId = params.get('peer');
      if (peerId) {
        connectToPeer(peerId);
      }
    }
  </script>
</body>
</html>
